    <div id="form-wrapper">

      <header>
        <h1>Any Inquiries or Feedback?</h1>

      </header>

      <form action="mailto:joshua.tuibuen@ontariotechu.net" method="post" enctype="text/plain" name="form">
        
        <div class="form-field">
          <p>
            <label for="Fname">First Name: </label>
            <input type="text" , name="Fname" , size="70" , required, placeholder="Enter your First Name">
          </p>
        </div>
      
        <div class="form-field">
          <p>
            <label for="Lname">Last Name: </label>
            <input type="text" , name="Lname" , size="70" , required, placeholder="Enter your Last Name">
          </p>
        </div>
    
        <div class="form-field"> 
          <p>
            <label for="email">Email: </label>
            <input type="email" , name="email" , size="70" , required, placeholder="Enter your Email Address">
          </p>
        </div>
    
        <div class="form-field"> 
          <p>
            <label for="Comments">Comments: </label>
            <br>
            <textarea name="Comments" cols="70" rows="10", required, placeholder="Questions, feedback, comments..."></textarea>
          </p>
        </div>

        <div id="submit-button">
          <input type="submit" value="Submit the Form">
        </div>
